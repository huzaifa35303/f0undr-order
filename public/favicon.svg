<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1f1d1a"/>
      <stop offset="55%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#050404"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none" stroke="url(#borderGrad)" stroke-width="10" stroke-opacity="0.85"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- Centered 'f0' Monogram -->
  <g filter="url(#glow)">
    <!-- 'f' Glyph -->
    <g transform="translate(112, 102)">
      <!-- crossbar -->
      <rect x="14" y="152" width="102" height="26" rx="7" fill="url(#goldGradient)"/>
      <!-- stem and curved head -->
      <path d="M 104 36 C 80 36 48 52 48 106 L 48 290 C 48 298 52 302 60 302 L 86 302 L 86 316 L 14 316 L 14 302 L 36 302 C 44 302 46 298 46 290 L 46 118 C 46 72 68 56 98 56 C 114 56 126 60 134 66 L 142 40 C 130 36 118 36 104 36 Z" fill="url(#goldGradient)"/>
      <!-- teardrop finial -->
      <circle cx="134" cy="50" r="12" fill="#fffbeb"/>
    </g>

    <!-- '0' Glyph with Orbit Cut -->
    <g transform="translate(262, 134)">
      <!-- Outer Oval -->
      <ellipse cx="76" cy="138" rx="68" ry="98" fill="none" stroke="url(#goldGradient)" stroke-width="28"/>
      <!-- Core Cutout to ensure clarity -->
      <ellipse cx="76" cy="138" rx="38" ry="68" fill="#0c0a09"/>
      <!-- Precision Center Diamond -->
      <polygon points="76,118 90,138 76,158 62,138" fill="#fffbeb"/>
    </g>
  </g>
</svg>
